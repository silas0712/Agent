<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>agentteam · 多模型协作面板</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --panel-2: #1e2230;
    --line: #2a2f3d;
    --text: #e6e8ee;
    --dim: #8b93a7;
    --accent: #4f8cff;
    --ok: #35c46b;
    --warn: #f0b429;
    --err: #ff5c5c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.6 "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
  }
  header {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 18px; border-bottom: 1px solid var(--line); background: var(--panel);
  }
  header h1 { font-size: 16px; margin: 0; letter-spacing: .5px; }
  header .ver { color: var(--dim); font-weight: 400; font-size: 12px; }
  header .spacer { flex: 1; }
  .badge {
    font-size: 12px; color: var(--dim); border: 1px solid var(--line);
    padding: 2px 8px; border-radius: 999px;
  }
  main { display: grid; grid-template-columns: 320px 1fr; height: calc(100vh - 49px); }
  aside {
    border-right: 1px solid var(--line); background: var(--panel);
    padding: 14px; overflow-y: auto;
  }
  section { display: flex; flex-direction: column; min-width: 0; }
  textarea, input, select, button {
    width: 100%; background: var(--panel-2); color: var(--text);
    border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px;
    font: inherit; outline: none;
  }
  textarea { resize: vertical; min-height: 84px; }
  textarea:focus, input:focus, select:focus { border-color: var(--accent); }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
  .check { display: flex; align-items: center; gap: 6px; margin: 10px 0; color: var(--dim); font-size: 13px; }
  .check input { width: auto; }
  button {
    cursor: pointer; background: var(--accent); border-color: var(--accent);
    color: #fff; font-weight: 600; margin-top: 6px;
  }
  button.ghost { background: transparent; color: var(--text); border-color: var(--line); font-weight: 400; }
  button:disabled { opacity: .55; cursor: default; }
  h2 { font-size: 13px; color: var(--dim); text-transform: uppercase; letter-spacing: .06em; margin: 18px 0 8px; }
  ul { list-style: none; margin: 0; padding: 0; }
  li.session {
    padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px;
    margin-bottom: 6px; cursor: pointer; font-size: 13px;
  }
  li.session:hover { border-color: var(--accent); }
  li.session.active { border-color: var(--accent); background: var(--panel-2); }
  li.session .meta { color: var(--dim); font-size: 12px; }
  .status {
    padding: 10px 18px; border-bottom: 1px solid var(--line);
    color: var(--dim); font-size: 13px; display: flex; flex-wrap: wrap; gap: 14px;
  }
  .status b { color: var(--text); }
  .stream { flex: 1; overflow-y: auto; padding: 14px 18px; }
  .msg { border-left: 3px solid var(--line); padding: 6px 12px; margin-bottom: 10px; background: var(--panel); border-radius: 0 8px 8px 0; }
  .msg .head { font-size: 12px; color: var(--dim); }
  .msg .body { white-space: pre-wrap; word-break: break-word; }
  .msg.user { border-color: #8892a6; }
  .msg.planner { border-color: #37bcd4; }
  .msg.actor { border-color: var(--ok); }
  .msg.reviewer { border-color: var(--warn); }
  .msg.tester { border-color: #6aa8ff; }
  .msg.orchestrator { border-color: #b06bff; }
  .msg.error { border-color: var(--err); }
  .actions { display: flex; gap: 8px; padding: 10px 18px; border-top: 1px solid var(--line); }
  .actions button { margin: 0; width: auto; }
  .empty { color: var(--dim); padding: 20px 0; }
</style>
</head>
<body>
<header>
  <h1>agentteam <span class="ver" id="version"></span></h1>
  <span class="badge" id="badge">加载中…</span>
  <span class="spacer"></span>
  <span class="badge" id="clock"></span>
</header>
<main>
  <aside>
    <form id="run-form">
      <textarea id="goal" placeholder="描述目标，例如：写一个 hello.py 和 pytest 测试"></textarea>
      <div class="row">
        <select id="provider">
          <option value="">默认 provider</option>
          <option value="mock">mock（离线）</option>
          <option value="openai">openai 兼容</option>
        </select>
        <input id="model" placeholder="模型名（可选）" />
      </div>
      <label class="check"><input type="checkbox" id="strict" /> 首次审查先否决（mock 演示返工）</label>
      <button type="submit" id="run-btn">▶ 运行</button>
    </form>
    <h2>会话</h2>
    <ul id="sessions"></ul>
  </aside>
  <section>
    <div class="status" id="status">未选择会话</div>
    <div class="stream" id="stream"><p class="empty">左侧输入目标并点击“运行”，或选择一条历史会话回放。</p></div>
    <div class="actions">
      <button class="ghost" data-art="markdown">transcript.md</button>
      <button class="ghost" data-art="transcript">transcript.json</button>
      <button class="ghost" data-art="log">session.log</button>
    </div>
  </section>
</main>
<script>
const ROLE_ICON = {
  user: "👤", orchestrator: "🎼", planner: "🧭",
  actor: "🛠", reviewer: "🔍", tester: "🧪", system: "⚙"
};
const $ = (id) => document.getElementById(id);
let currentSession = null;
let socket = null;

async function api(path, options) {
  const response = await fetch(path, options);
  if (!response.ok) {
    let detail = response.statusText;
    try { detail = (await response.json()).detail || detail; } catch (err) { /* not json */ }
    throw new Error(detail);
  }
  return response.json();
}

function esc(text) {
  return String(text).replace(/[&<>"']/g, (ch) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[ch]));
}

function time(stamp) {
  if (!stamp) return "--:--:--";
  return new Date(stamp * 1000).toLocaleTimeString("zh-CN", { hour12: false });
}

function summarise(payload) {
  const text = payload.summary || payload.goal || payload.reason || "";
  if (text) return text;
  const keys = Object.keys(payload).sort();
  return keys.length ? "(" + keys.join(",") + ")" : "(空)";
}

function renderMessage(envelope) {
  const div = document.createElement("div");
  const role = envelope.from || "system";
  const type = envelope.type || "log";
  div.className = "msg " + role + (type === "error" ? " error" : "");
  const icon = ROLE_ICON[role] || "•";
  div.innerHTML =
    '<div class="head">' + icon + " " + esc(role) + " → " + esc(envelope.to) +
    " · " + esc(type) + " · round " + esc(envelope.round) +
    " · " + time(envelope.created_at) + "</div>" +
    '<div class="body">' + esc(summarise(envelope.payload || {})) + "</div>";
  return div;
}

function appendMessage(envelope, { scroll = true } = {}) {
  const empty = $("stream").querySelector(".empty");
  if (empty) empty.remove();
  $("stream").appendChild(renderMessage(envelope));
  if (scroll) $("stream").scrollTop = $("stream").scrollHeight;
}

function renderStatus(info) {
  const stats = info.stats || {};
  const parts = [
    "<b>" + esc(info.id || currentSession || "-") + "</b>",
    "状态 <b>" + esc(info.status || "?") + "</b>",
    "轮次 <b>" + (info.rounds ?? 0) + "</b>",
    "耗时 <b>" + Number(info.duration || 0).toFixed(1) + "s</b>",
    "消息 <b>" + (info.messages ?? 0) + "</b>",
    "模型调用 <b>" + (stats.llm_calls ?? 0) + "</b>",
    "工具调用 <b>" + (stats.tool_calls ?? 0) + "</b>",
    "tokens <b>" + (stats.tokens ?? 0) + "</b>"
  ];
  if (info.reason) parts.push("结论 " + esc(info.reason));
  $("status").innerHTML = parts.join("");
}

function resetStream() {
  $("stream").innerHTML = '<p class="empty">等待消息…</p>';
}

function closeSocket() {
  if (socket) { socket.close(); socket = null; }
}

function connect(sessionId) {
  closeSocket();
  resetStream();
  currentSession = sessionId;
  socket = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws/" + sessionId);
  socket.onmessage = (event) => {
    const data = JSON.parse(event.data);
    if (data.kind === "message") appendMessage(data.message);
    else if (data.kind === "status") renderStatus(data);
    else if (data.kind === "done") { renderStatus(data); loadSessions(); }
    else if (data.kind === "error") appendMessage({
      from: "system", to: "broadcast", type: "error", round: 0,
      created_at: Date.now() / 1000, payload: { summary: data.detail }
    });
  };
  socket.onclose = () => { closeSocket(); loadSessions(); };
}
</script>
<script>
async function loadSessions() {
  try {
    const data = await api("/api/sessions?limit=40");
    const list = $("sessions");
    const items = [...data.running, ...data.history];
    list.innerHTML = "";
    if (!items.length) {
      list.innerHTML = '<li class="session"><span class="meta">还没有会话</span></li>';
      return;
    }
    for (const item of items) {
      const li = document.createElement("li");
      li.className = "session" + (item.id === currentSession ? " active" : "");
      const goal = (item.goal || "").replace(/\s+/g, " ").slice(0, 60);
      li.innerHTML =
        "<div>" + esc(goal || "(无目标)") + "</div>" +
        '<div class="meta">' + esc(item.status) + " · " + (item.rounds ?? 0) + " 轮 · " +
        Number(item.duration || 0).toFixed(1) + "s · " + esc(item.id) + "</div>";
      li.onclick = () => { connect(item.id); renderStatus(item); };
      list.appendChild(li);
    }
  } catch (err) {
    $("badge").textContent = "会话列表加载失败：" + err.message;
  }
}

$("run-form").addEventListener("submit", async (event) => {
  event.preventDefault();
  const goal = $("goal").value.trim();
  if (!goal) return;
  const button = $("run-btn");
  button.disabled = true;
  try {
    localStorage.setItem("agentteam.goal", goal);
    const session = await api("/api/sessions", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        goal: goal,
        provider: $("provider").value || null,
        model: $("model").value.trim() || null,
        strict_first_review: $("strict").checked
      })
    });
    connect(session.id);
    renderStatus(session);
    loadSessions();
  } catch (err) {
    alert("启动失败：" + err.message);
  } finally {
    button.disabled = false;
  }
});

document.querySelectorAll(".actions button").forEach((button) => {
  button.onclick = () => {
    if (!currentSession) { alert("请先选择或启动一个会话"); return; }
    window.open("/api/sessions/" + currentSession + "/" + button.dataset.art, "_blank");
  };
});

async function boot() {
  $("goal").value = localStorage.getItem("agentteam.goal") || "";
  try {
    const config = await api("/api/config");
    $("version").textContent = "v" + config.version;
    const warnings = config.warnings || [];
    $("badge").textContent =
      "bus " + config.bus + " · workspace " + config.workspace +
      (warnings.length ? " · ⚠ " + warnings.length + " 条配置提示" : "");
    $("badge").title = warnings.join("\n");
  } catch (err) {
    $("badge").textContent = "配置加载失败：" + err.message;
  }
  await loadSessions();
  setInterval(loadSessions, 5000);
  setInterval(() => {
    $("clock").textContent = new Date().toLocaleTimeString("zh-CN", { hour12: false });
  }, 1000);
}

boot();
</script>
</body>
</html>
