name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'version to build (defaults to pyproject.toml)'
        required: false

permissions:
  contents: write

jobs:
  test:
    name: tests (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[web,dev]"
      - name: pytest
        run: python -m pytest -q -p no:cacheprovider

  installer:
    name: windows installer + dist
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[web,dev]" build wheel
      - name: resolve the version
        shell: pwsh
        run: |
          $version = "${{ github.event.inputs.version }}"
          if (-not $version) { $version = "${{ github.ref_name }}".TrimStart('v') }
          if ($version -notmatch '^\d+\.\d+\.\d+') {
            $version = (Select-String -Path pyproject.toml -Pattern '^version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          }
          "AGENTTEAM_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding ascii
          Write-Host "building agentteam $version"
      - name: install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: wheel and sdist
        run: python -m build
      - name: windows installer
        shell: pwsh
        run: |
          pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/build-installer.ps1 -Version $env:AGENTTEAM_VERSION
      - name: checksums
        shell: pwsh
        run: |
          $lines = Get-ChildItem dist -File | Where-Object { $_.Name -ne 'SHA256SUMS.txt' } |
            Sort-Object Name |
            ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" }
          Set-Content -Path dist/SHA256SUMS.txt -Value $lines -Encoding ascii
          $lines | ForEach-Object { Write-Host $_ }
      - name: upload the build artefacts
        uses: actions/upload-artifact@v4
        with:
          name: agentteam-${{ env.AGENTTEAM_VERSION }}
          path: dist/*
          if-no-files-found: error
      - name: attach to the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
