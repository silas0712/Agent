[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentteam"
version = "0.1.0"
description = "Multi-model collaborative development agents (plan / act / review / test)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "rich>=13.7",
]

[project.optional-dependencies]
openai = ["openai>=1.30"]
redis = ["redis>=5.0"]
dev = ["pytest>=8.0"]

[project.scripts]
agentteam = "agentteam.main:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
# every test in this project is a plain function; without this, pytest tries to
# collect imported classes such as ``TesterAgent`` or ``TestResult``.
python_classes = ["Check*"]
